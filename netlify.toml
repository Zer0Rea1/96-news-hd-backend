[build]
  command = "NODE_ENV=development bun install --frozen-lockfile && bun run build"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV = "development"
  BUN_VERSION = "1.4.4"
  BUN_FLAGS = "--frozen-lockfile"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200
  force = true
